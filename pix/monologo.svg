<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Submission with page check</title>
  <!-- The sheet behind, so the icon reads as more than one page. -->
  <path d="M8.5 5.25h5.75L18.75 9.5v7" opacity=".55"/>
  <!-- The sheet in front, with its folded corner. -->
  <path d="M6.75 2.75h4.9L15.75 6.9v11.35a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2Z"/>
  <path d="M11.4 2.9v4.1h4.2"/>
  <!-- Counted lines: a marker and a line for each page. -->
