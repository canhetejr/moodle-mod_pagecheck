name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest version the plugin supports, and the newest.
          - {moodle: 'MOODLE_401_STABLE', php: '8.0'}
          - {moodle: 'MOODLE_405_STABLE', php: '8.2'}
          - {moodle: 'MOODLE_500_STABLE', php: '8.3'}

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, pgsql, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          # moodle-plugin-ci installs its own Node through nvm and needs to be told where it
          # lives; without this the install step gives up before it fetches Moodle.
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle ${{ matrix.moodle }}
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./plugin

      - name: Moodle code style
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 ./plugin

      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0 ./plugin

      - name: Validate the database definition and language files
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./plugin

      - name: Check the database upgrade path
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./plugin

      - name: Mustache templates
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache ./plugin

      - name: Rebuild the AMD modules
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0 ./plugin

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning ./plugin

      - name: Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome ./plugin

  package:
    name: Build the installable ZIP
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          # git archive reads a commit, so the full history has to be present.
          fetch-depth: 0

      - name: Build the package
        run: tools/package.sh "$GITHUB_SHA"

      - name: Check the archive has the root folder Moodle expects
        run: |
          unzip -l dist/pagecheck.zip | grep -q 'pagecheck/version.php'
          ! unzip -l dist/pagecheck.zip | grep -q '\.github/'

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pagecheck-zip
          path: dist/pagecheck.zip
          if-no-files-found: error

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pagecheck.zip
